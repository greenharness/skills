name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No machine-specific content, every forked skill keeps its notice
        run: ./scripts/check.sh
      - name: sweep.py compiles
        run: python3 -m py_compile parts/workflow/skills/worktree-sweep/sweep.py
